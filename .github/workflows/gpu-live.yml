name: gpu-live

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  minicpm-o45:
    runs-on: [self-hosted, linux, x64, rtx3090]
    timeout-minutes: 120
    env:
      JMCP_TALK_ADAPTER: minicpm-o45
      JMCP_TALK_MINICPM_O45_DEVICE: cuda:0
      JMCP_TALK_MINICPM_O45_QUANTIZATION: int4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: MiniCPM live lane
        run: bash ops/ci/minicpm-live.sh
